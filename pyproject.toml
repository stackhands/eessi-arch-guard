[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eessi-arch-guard"
version = "0.3.1"
description = "Reload an EESSI module environment when a Slurm task lands on another CPU or GPU target. Ships the static eessi-arch-guard binary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Goswami", email = "rgoswami@ieee.org" }]
requires-python = ">=3.9"
keywords = ["eessi", "slurm", "lmod", "hpc"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = []

[project.scripts]
eessi-arch-guard = "eessi_arch_guard:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["eessi_arch_guard"]
include-package-data = false

[tool.setuptools.package-data]
eessi_arch_guard = ["bin/eessi-arch-guard"]

[tool.setuptools.data-files]
"share/eessi-arch-guard" = ["share/sitepath.py", "share/cvmfsrev.py"]
"share/eessi-arch-guard/lmod" = ["share/lmod/SitePackage.lua"]
"share/bash-completion/completions" = ["share/completions/eessi-arch-guard"]
"share/zsh/site-functions" = ["share/completions/_eessi-arch-guard"]
"share/man/man1" = ["share/man/eessi-arch-guard.1"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
