name: release
# On a tag vX.Y.Z: build the static binaries, test each on its own
# architecture, check the version string against the tag, and publish the
# binaries with SHA256SUMS and build provenance attestations.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build test --summary all
      - uses: ./.github/actions/allow-userns
      - name: Python suite against the binary
        run: |
          python3 -m pip install setuptools
          python3 setup.py build_ext --inplace
          zig build -Drelease=true && TOOL_BIN="$PWD/zig-out/bin/eessi-arch-guard" python3 -m unittest discover -s tests
      - name: build
        run: |
          zig build -Drelease=true -Dtarget=${{ matrix.arch }}-linux-musl -Dcommit="${GITHUB_SHA::7}" --prefix out
          # --version prints the bare version, then the build and the commit.
          zon=$(sed -nE 's/^ *\.version = "([^"]+)".*/\1/p' build.zig.zon)
          if [ "${zon}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "versions: tag ${GITHUB_REF_NAME}, build.zig.zon ${zon}"; exit 1
          fi
          got=$(out/bin/eessi-arch-guard --version)
          case "${got}" in
            "${GITHUB_REF_NAME#v} ("*", ${GITHUB_SHA::7})") ;;
            *) echo "version '${got}' does not match tag ${GITHUB_REF_NAME} and commit ${GITHUB_SHA::7}"; exit 1 ;;
          esac
          pkg=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/eessi_arch_guard/__init__.py)
          if [ "${pkg}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "versions: tag ${GITHUB_REF_NAME}, Python package ${pkg}"; exit 1
          fi
          install -d dist
          cp out/bin/eessi-arch-guard "dist/eessi-arch-guard-${GITHUB_REF_NAME#v}-${{ matrix.arch }}-linux-musl"
      - name: completion files and man page
        run: |
          install -d dist/share/completions dist/share/man
          cp share/completions/* dist/share/completions/
          cp share/man/eessi-arch-guard.1 dist/share/man/
          find dist/share -type f | sort
      - name: stage the binary into the package
        run: |
          rm -rf src/eessi_arch_guard/*.so build
          install -D -m 755 out/bin/eessi-arch-guard src/eessi_arch_guard/bin/eessi-arch-guard
      # The manylinux2014 images build one cp39-abi3 wheel and one wheel for
      # each of cp313t and cp314t; auditwheel repair tags them manylinux.
      - uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        with:
          output-dir: dist
      - name: check the wheels
        run: |
          python3 -m pip install --quiet auditwheel
          test "$(ls dist/*.whl | wc -l)" -eq 3
          for wheel in dist/*.whl; do
            python3 tools/check_wheel.py "$wheel"
            auditwheel show "$wheel"
          done
          ls dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release notes are the tag's section of CHANGELOG.md, "## X.Y.Z"
      # or "## [X.Y.Z] - date"; a tag without one is not released.
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (on) exit; h = $0; sub(/^## \[?/, "", h); sub(/[] ].*$/, "", h); on = (h == v); next } on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then echo "CHANGELOG.md has no section for ${v}"; exit 1; fi
          cat release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      # The completions and man page are one directory tree, the same from both
      # builds; a release asset is a file, so they go out as one archive.
      - name: archive the completion and manpage tree
        run: |
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf "dist/eessi-arch-guard-${GITHUB_REF_NAME#v}-share.tar.gz" share
          rm -r dist/share
          tar -tzf "dist/eessi-arch-guard-${GITHUB_REF_NAME#v}-share.tar.gz"
      - run: cd dist && sha256sum eessi-arch-guard-* eessi_arch_guard-*.whl > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --draft
